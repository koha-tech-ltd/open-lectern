name: evals

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  webmcp-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Deterministic WebMCP evals
        run: npm run test:evals
