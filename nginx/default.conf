server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/xml text/xml image/svg+xml;
    gzip_min_length 256;

    # Behind a reverse proxy or Cloudflare: never emit Location with listen :8080 or http://.
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Always revalidate HTML shells so rollouts pick up new hashed assets.
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /sitemap.xml =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /robots.txt =404;
    }

    location / {
        # HTML shells live at /studio/index.html etc. `$uri/` would 301
        # /studio → http://host:8080/studio/ (directory slash). Serve the
        # shell file instead so HTTPS lectern.click stays in the address bar.
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed Vite files must never become index.html. A 200/404 text/html
    # stylesheet + nosniff is a blank page ("MIME type is not a supported
    # stylesheet"). Missing hashes (rolling deploy) must 404 as text/plain
    # with no-store so Cloudflare does not cache HTML for /assets/*.css.
    location ^~ /assets/ {
        # mime.types has no .mjs; pdf.js 4 loads its worker as an ES module.
        types {
            text/css               css;
            application/javascript js mjs;
            application/wasm       wasm;
            image/png              png;
            image/jpeg             jpeg jpg;
            image/gif              gif;
            image/svg+xml          svg;
            font/woff              woff;
            font/woff2             woff2;
            font/ttf               ttf;
            application/json       json;
            text/plain             map txt;
        }
        try_files $uri @asset_miss;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location @asset_miss {
        internal;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 404 "not found\n";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp4|webm|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
