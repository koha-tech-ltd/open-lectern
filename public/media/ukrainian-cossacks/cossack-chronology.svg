<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Коротка хронологія українського козацтва</title><desc id="desc">Шкала подій від появи козаків до ліквідації Січі.</desc>
<rect width="1200" height="430" rx="24" fill="#f7f0d9"/><text x="60" y="75" font-family="Georgia,serif" font-size="38" fill="#24382c">Козацька доба: орієнтири в часі</text><path d="M110 220H1090" stroke="#b78b44" stroke-width="12" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" fill="#24382c"><g><circle cx="150" cy="220" r="22" fill="#c44932"/><text x="95" y="170" font-size="26" font-weight="bold">XVI ст.</text><text x="62" y="285" font-size="21">поява перших</text><text x="72" y="310" font-size="21">козацьких громад</text></g><g><circle cx="400" cy="220" r="22" fill="#c44932"/><text x="348" y="170" font-size="26" font-weight="bold">1556</text><text x="318" y="285" font-size="21">укріплення на</text><text x="315" y="310" font-size="21">Малій Хортиці</text></g><g><circle cx="650" cy="220" r="22" fill="#c44932"/><text x="598" y="170" font-size="26" font-weight="bold">1648</text><text x="555" y="285" font-size="21">початок повстання</text><text x="570" y="310" font-size="21">Б. Хмельницького</text></g><g><circle cx="900" cy="220" r="22" fill="#c44932"/><text x="845" y="170" font-size="26" font-weight="bold">1710</text><text x="817" y="285" font-size="21">Конституція</text><text x="810" y="310" font-size="21">Пилипа Орлика</text></g><g><circle cx="1080" cy="220" r="22" fill="#c44932"/><text x="1025" y="170" font-size="26" font-weight="bold">1775</text><text x="1001" y="285" font-size="21">ліквідація</text><text x="1016" y="310" font-size="21">Запорозької Січі</text></g></g>
</svg>
