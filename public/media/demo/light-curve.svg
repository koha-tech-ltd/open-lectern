<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FAF7F1"/><text x="64" y="64" font-family="Georgia, serif" font-size="34" fill="#24382C" font-weight="600">Light-response curve</text><text x="64" y="100" font-family="Segoe UI, sans-serif" font-size="18" fill="#5C3A21">r(I) = r_max * I / (I + K) -- rise, then saturation</text><line x1="160" y1="560" x2="1120" y2="560" stroke="#5C3A21" stroke-width="3"/><line x1="160" y1="560" x2="160" y2="160" stroke="#5C3A21" stroke-width="3"/><text x="620" y="610" font-family="Segoe UI, sans-serif" font-size="18" fill="#5C3A21">I (light intensity)</text><line x1="160" y1="200" x2="1120" y2="200" stroke="#C4A35A" stroke-width="2" stroke-dasharray="8 8"/><text x="1130" y="206" font-family="Georgia, serif" font-size="18" fill="#B8843A">r_max</text><path d="M160 560 C 280 520, 360 380, 480 300 S 780 210, 1120 205" fill="none" stroke="#24382C" stroke-width="5"/><line x1="420" y1="560" x2="420" y2="360" stroke="#3A5644" stroke-width="2" stroke-dasharray="4 6"/><circle cx="420" cy="380" r="7" fill="#C4A35A"/><text x="400" y="590" font-family="Georgia, serif" font-size="18" fill="#3A5644">K</text><text x="220" y="500" font-family="Segoe UI, sans-serif" font-size="15" fill="#5C3A21">I much less than K: nearly linear</text><text x="820" y="250" font-family="Segoe UI, sans-serif" font-size="15" fill="#5C3A21">I much greater than K: saturated</text></svg>