<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F4EFE6"/><text x="64" y="72" font-family="Georgia, serif" font-size="34" fill="#24382C" font-weight="600">Inputs to light to outputs</text><text x="64" y="110" font-family="Segoe UI, sans-serif" font-size="18" fill="#5C3A21">carbon dioxide + water  -&gt;  sugar + oxygen</text><circle cx="120" cy="280" r="48" fill="#FAF7F1" stroke="#5C3A21" stroke-width="3"/><text x="120" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#24382C">CO2</text><text x="230" y="290" font-family="Georgia, serif" font-size="40" fill="#C4A35A">+</text><circle cx="340" cy="280" r="48" fill="#FAF7F1" stroke="#3A5644" stroke-width="3"/><text x="340" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#24382C">H2O</text><circle cx="640" cy="270" r="70" fill="#C4A35A" opacity="0.35"/><circle cx="640" cy="270" r="42" fill="#B8843A"/><ellipse cx="640" cy="380" rx="70" ry="28" fill="#3A5644"/><text x="640" y="276" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#FAF7F1">light</text><text x="820" y="290" font-family="Georgia, serif" font-size="40" fill="#C4A35A">-&gt;</text><rect x="905" y="240" width="110" height="80" rx="12" fill="#FAF7F1" stroke="#24382C" stroke-width="3"/><text x="960" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#24382C">sugar</text><text x="1075" y="290" font-family="Georgia, serif" font-size="40" fill="#C4A35A">+</text><circle cx="1180" cy="280" r="40" fill="#FAF7F1" stroke="#3A5644" stroke-width="3"/><text x="1180" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#24382C">O2</text><rect x="64" y="520" width="1152" height="120" rx="8" fill="#24382C" opacity="0.06"/><text x="96" y="575" font-family="Georgia, serif" font-size="22" fill="#24382C">6 CO2 + 6 H2O  --light--&gt;  C6H12O6 + 6 O2</text></svg>