<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAF7F1"/>
  <text x="64" y="64" font-family="Georgia, serif" font-size="34" fill="#24382C" font-weight="600">Rate rises, then flattens</text>
  <text x="64" y="100" font-family="Segoe UI, sans-serif" font-size="18" fill="#5C3A21">Motion plate for light intensity vs photosynthetic rate</text>
  <line x1="160" y1="560" x2="1120" y2="560" stroke="#5C3A21" stroke-width="3"/>
  <line x1="160" y1="560" x2="160" y2="160" stroke="#5C3A21" stroke-width="3"/>
  <path id="curve" d="M160 560 C 300 500, 420 340, 560 280 S 900 210, 1120 205" fill="none" stroke="#24382C" stroke-width="5"/>
  <circle r="10" fill="#C4A35A">
    <animateMotion dur="5s" repeatCount="indefinite" path="M160 560 C 300 500, 420 340, 560 280 S 900 210, 1120 205"/>
  </circle>
  <text x="200" y="500" font-family="Segoe UI, sans-serif" font-size="15" fill="#5C3A21">climbing</text>
  <text x="900" y="250" font-family="Segoe UI, sans-serif" font-size="15" fill="#5C3A21">saturated</text>
</svg>
