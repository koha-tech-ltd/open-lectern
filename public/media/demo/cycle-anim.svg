<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F4EFE6"/><text x="64" y="64" font-family="Georgia, serif" font-size="34" fill="#24382C" font-weight="600">Cycle in motion</text><text x="64" y="100" font-family="Segoe UI, sans-serif" font-size="18" fill="#5C3A21">Light energy to chemical energy (loop)</text><circle cx="640" cy="400" r="180" fill="none" stroke="#C4A35A" stroke-width="3" stroke-dasharray="12 10"/><g><animateTransform attributeName="transform" type="rotate" from="0 640 400" to="360 640 400" dur="8s" repeatCount="indefinite"/><circle cx="640" cy="220" r="22" fill="#B8843A"/><text x="640" y="226" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#FAF7F1">light</text></g><g><animateTransform attributeName="transform" type="rotate" from="120 640 400" to="480 640 400" dur="8s" repeatCount="indefinite"/><circle cx="640" cy="220" r="22" fill="#3A5644"/><text x="640" y="226" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#FAF7F1">CO2</text></g><g><animateTransform attributeName="transform" type="rotate" from="240 640 400" to="600 640 400" dur="8s" repeatCount="indefinite"/><circle cx="640" cy="220" r="22" fill="#24382C"/><text x="640" y="226" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#FAF7F1">sugar</text></g><ellipse cx="640" cy="400" rx="70" ry="36" fill="#3A5644"/><text x="640" y="406" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#FAF7F1">leaf</text></svg>